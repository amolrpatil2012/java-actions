on: 
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name : Install java
        uses:  actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
       # Step 3: Build the Maven project and run tests
      - name: Build with Maven
        run: mvn -B package

      # Step 4: Copy JAR files to staging directory
      - name: Copy JAR files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Get-ChildItem -Path . -Filter *.jar -Recurse |
            Where-Object { $_.FullName -match '[\\/]target[\\/]' } |
            Copy-Item -Destination staging

      # Step 5: Publish build artifact
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: staging/*.jar
          if-no-files-found: error
               
      
  
